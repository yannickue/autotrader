# SHADOW-ONLY market spec for broker symbol XRPUSD (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "XRPUSD"
broker_symbol = "XRPUSD"
broker_path = "Cryptocurrency\\XRPUSD"
cluster = "CRYPTO"
description = "Ripple vs US Dollar"
mode = "shadow_only"

[instrument]
point_size = 0.0001
digits = 4
contract_size = 1.0
tick_size = 0.0001
volume_min = 0.01
volume_step = 0.01
volume_max = 30000.0
currency_profit = "USD"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [0, 1435, 8]
tue = [0, 1435, 9]
wed = [0, 1435, 9]
thu = [0, 1435, 9]
fri = [0, 1375, 8]
sun = [1380, 1435, 8]

[cost]
reference_median_spread_price = 0.01
reference_p95_spread_price = 0.01
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -21.0
swap_short_points = 3.0

[risk]
max_entry_spread_price = 0.0125
implied_leverage = 1.3152808056558312
margin_min_lot_eur = 0.01

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds"]

[provenance]
snapshot_date = "2026-09-30"
