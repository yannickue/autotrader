# SHADOW-ONLY market spec for broker symbol Sugar (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "SUGAR"
broker_symbol = "Sugar"
broker_path = "Spot Energy\\Sugar"
cluster = "COMMODITY_SOFT"
description = "Sugar Cash CFD"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 1120.0
tick_size = 0.01
volume_min = 0.01
volume_step = 0.01
volume_max = 10.0
currency_profit = "USD"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [570, 1075, 23]
tue = [570, 1075, 25]
wed = [570, 1075, 26]
thu = [570, 1075, 25]
fri = [570, 1075, 23]

[cost]
reference_median_spread_price = 0.05
reference_p95_spread_price = 0.05
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -28.997
swap_short_points = 13.485

[risk]
max_entry_spread_price = 0.0625
implied_leverage = 9.983722515641121
margin_min_lot_eur = 18.59

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
snapshot_date = "2026-09-30"
