# SHADOW-ONLY market spec for broker symbol Bra50 (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "BRA50"
broker_symbol = "Bra50"
broker_path = "Cash Indices\\Bra50"
cluster = "INDEX"
description = "Bovespa Cash Index"
mode = "shadow_only"

[instrument]
point_size = 1.0
digits = 0
contract_size = 0.2
tick_size = 5.0
volume_min = 0.05
volume_step = 0.01
volume_max = 100.0
currency_profit = "BRL"
currency_margin = "BRL"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
