# SHADOW-ONLY market spec for broker symbol UsaInd (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "USAIND"
broker_symbol = "UsaInd"
broker_path = "Cash Indices\\UsaInd"
cluster = "INDEX"
description = "Dow Jones Industrial Cash Index"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 1.0
tick_size = 0.01
volume_min = 0.05
volume_step = 0.05
volume_max = 50.0
currency_profit = "USD"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [0, 1375, 9]
tue = [0, 1375, 9]
wed = [0, 1375, 9]
thu = [0, 1375, 9]
fri = [0, 1375, 9]

[cost]
reference_median_spread_price = 1.35
reference_p95_spread_price = 3.52
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -6.86
swap_short_points = 0.86

[risk]
max_entry_spread_price = 4.4
implied_leverage = 19.99786045874878
margin_min_lot_eur = 112.63

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds"]

[provenance]
snapshot_date = "2026-09-30"
