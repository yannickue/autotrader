# SHADOW-ONLY market spec for broker symbol SAN.FR (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "SAN_FR"
broker_symbol = "SAN.FR"
broker_path = "CFD Fra Shares\\FR Shares 5\\SAN.FR"
cluster = "STOCKS"
description = "Sanofi SA"
mode = "shadow_only"

[instrument]
point_size = 0.001
digits = 3
contract_size = 1.0
tick_size = 0.001
volume_min = 0.01
volume_step = 0.01
volume_max = 306.0
currency_profit = "EUR"
currency_margin = "EUR"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [540, 1045, 24]
tue = [540, 1045, 24]
wed = [540, 1045, 24]
thu = [540, 1045, 23]
fri = [540, 1045, 23]

[cost]
reference_median_spread_price = 0.08
reference_p95_spread_price = 0.08
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -5.445
swap_short_points = -0.555

[risk]
max_entry_spread_price = 0.1
implied_leverage = 5.175
margin_min_lot_eur = 0.14

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
snapshot_date = "2026-09-30"
