# SHADOW-ONLY market spec for broker symbol USDCNH (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "USDCNH"
broker_symbol = "USDCNH"
broker_path = "Forex\\Exotics\\USDCNH"
cluster = "FX"
description = "US Dollar vs Offshore Chinese Renminbi"
mode = "shadow_only"

[instrument]
point_size = 0.0001
digits = 4
contract_size = 100000.0
tick_size = 0.0001
volume_min = 0.01
volume_step = 0.01
volume_max = 50.0
currency_profit = "CNH"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [150, 1375, 10]
tue = [150, 1375, 10]
wed = [150, 1375, 10]
thu = [150, 1375, 9]
fri = [150, 1375, 10]

[cost]
reference_median_spread_price = 0.0011
reference_p95_spread_price = 0.0011
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 1
swap_long_points = 1.0
swap_short_points = -11.4

[risk]
max_entry_spread_price = 0.0013750000000000001
implied_leverage = 20.000460530604176
margin_min_lot_eur = 44.13

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
