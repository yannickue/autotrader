# SHADOW-ONLY market spec for broker symbol Palladium (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "PALLADIUM"
broker_symbol = "Palladium"
broker_path = "Metals\\Palladium"
cluster = "METALS"
description = "Palladium"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 100.0
tick_size = 0.01
volume_min = 0.01
volume_step = 0.01
volume_max = 10.0
currency_profit = "USD"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [0, 1375, 9]
tue = [0, 1375, 9]
wed = [0, 1375, 9]
thu = [0, 1375, 9]
fri = [0, 1375, 9]

[cost]
reference_median_spread_price = 9.72
reference_p95_spread_price = 10.0
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 1
swap_long_points = -84.64
swap_short_points = -56.32

[risk]
max_entry_spread_price = 12.5
implied_leverage = 9.963727793398764
margin_min_lot_eur = 107.27

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds"]

[provenance]
snapshot_date = "2026-09-30"
