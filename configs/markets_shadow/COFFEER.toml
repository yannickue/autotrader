# SHADOW-ONLY market spec for broker symbol CoffeeR (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "COFFEER"
broker_symbol = "CoffeeR"
broker_path = "Spot Energy\\CoffeeR"
cluster = "COMMODITY_SOFT"
description = "Coffee Robusta Cash CFD"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 10.0
tick_size = 0.01
volume_min = 0.01
volume_step = 0.01
volume_max = 10.0
currency_profit = "USD"
