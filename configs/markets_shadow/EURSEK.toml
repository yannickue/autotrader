# SHADOW-ONLY market spec for broker symbol EURSEK (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "EURSEK"
broker_symbol = "EURSEK"
broker_path = "Forex\\Exotics\\EURSEK"
cluster = "FX"
description = "Euro vs Sweden Krona"
mode = "shadow_only"

[instrument]
point_size = 1e-05
digits = 5
contract_size = 100000.0
tick_size = 1e-05
volume_min = 0.01
volume_step = 0.01
volume_max = 20.0
currency_profit = "SEK"
currency_margin = "EUR"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [0, 1435, 8]
tue = [0, 1435, 9]
wed = [0, 1435, 9]
thu = [0, 1435, 9]
fri = [0, 1375, 8]
sun = [1385, 1435, 8]

[cost]
reference_median_spread_price = 0.00269
reference_p95_spread_price = 0.008860000000000002
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 1
swap_long_points = -37.0
swap_short_points = -78.23

[risk]
max_entry_spread_price = 0.011075000000000002
implied_leverage = 20.0
margin_min_lot_eur = 50.0

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds"]

[provenance]
snapshot_date = "2026-09-30"
