# SHADOW-ONLY market spec for broker symbol Cocoa (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "COCOA"
broker_symbol = "Cocoa"
broker_path = "Spot Energy\\Cocoa"
cluster = "COMMODITY_SOFT"
description = "Cocoa Cash CFD"
mode = "shadow_only"

[instrument]
point_size = 1.0
digits = 0
contract_size = 10.0
tick_size = 1.0
volume_min = 0.01
volume_step = 0.01
volume_max = 10.0
currency_profit = "USD"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [645, 1165, 22]
tue = [645, 1165, 24]
wed = [645, 1165, 24]
thu = [645, 1165, 23]
fri = [645, 1165, 22]

[cost]
reference_median_spread_price = 10.0
reference_p95_spread_price = 10.0
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -13.619
swap_short_points = 5.231

[risk]
max_entry_spread_price = 12.5
implied_leverage = 9.990668700599684
margin_min_lot_eur = 47.6

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
snapshot_date = "2026-09-30"
