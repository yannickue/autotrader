# SHADOW-ONLY market spec for broker symbol Fra40 (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "FRA40"
broker_symbol = "Fra40"
broker_path = "Cash Indices\\Fra40"
cluster = "INDEX"
description = "CAC40 Cash Index"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 1.0
tick_size = 0.01
volume_min = 0.1
volume_step = 0.1
volume_max = 100.0
currency_profit = "EUR"
currency_margin = "EUR"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [480, 1315, 14]
tue = [480, 1315, 15]
wed = [480, 1315, 15]
thu = [480, 1315, 14]
fri = [480, 1315, 14]

[cost]
reference_median_spread_price = 1.35
reference_p95_spread_price = 1.6
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -5.445
swap_short_points = -0.555

[risk]
max_entry_spread_price = 2.0
implied_leverage = 19.999583963691382
margin_min_lot_eur = 39.66

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
snapshot_date = "2026-09-30"
