# SHADOW-ONLY market spec for broker symbol Cotton (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "COTTON"
broker_symbol = "Cotton"
broker_path = "Spot Energy\\Cotton"
cluster = "COMMODITY_SOFT"
description = "Cotton Cash CFD"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 500.0
tick_size = 0.01
volume_min = 0.01
volume_step = 0.01
