# SHADOW-ONLY market spec for broker symbol Esp35 (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "ESP35"
broker_symbol = "Esp35"
broker_path = "Cash Indices\\Esp35"
cluster = "INDEX"
description = "IBEX 35 Cash Index"
mode = "shadow_only"

[instrument]
point_size = 0.01
digits = 2
contract_size = 1.0
tick_size = 0.01
volume_min = 0.1
volume_step = 0.1
volume_max = 100.0
currency_profit = "EUR"
currency_margin = "EUR"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [480, 1195, 17]
tue = [480, 1195, 17]
wed = [480, 1195, 17]
thu = [480, 1195, 16]
fri = [480, 1195, 17]

[cost]
reference_median_spread_price = 3.58
reference_p95_spread_price = 6.75
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 5
swap_long_points = -5.445
swap_short_points = -0.555

[risk]
max_entry_spread_price = 8.4375
implied_leverage = 9.99811228431625
margin_min_lot_eur = 194.15

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
snapshot_date = "2026-09-30"
