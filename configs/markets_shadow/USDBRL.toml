# SHADOW-ONLY market spec for broker symbol USDBRL (Lane U, generated by scripts/universe_inventory.py build).
# mode = "shadow_only": observed/replayed only, NEVER tradable (no enablement switch exists; see src/markets/shadow.py).
# Calendar is PROVISIONAL, derived from observed M5 bar timestamps; cost inputs are OBSERVED recorded spreads.

[market]
canonical = "USDBRL"
broker_symbol = "USDBRL"
broker_path = "Forex\\Exotics\\USDBRL"
cluster = "FX"
description = "US Dollar vs Brazilian Real"
mode = "shadow_only"

[instrument]
point_size = 1e-05
digits = 5
contract_size = 100000.0
tick_size = 1e-05
volume_min = 0.01
volume_step = 0.01
volume_max = 50.0
currency_profit = "BRL"
currency_margin = "USD"

[calendar]
status = "provisional"
tz = "UTC"
server_utc_offset_s = 7200

[calendar.sessions_server_clock]
# weekday = [first_bar_minute, last_bar_minute, days_observed] (median per day, minutes since server midnight)
mon = [845, 1375, 22]
tue = [845, 1375, 23]
wed = [845, 1375, 24]
thu = [845, 1375, 22]
fri = [845, 1375, 22]

[cost]
reference_median_spread_price = 0.01
reference_p95_spread_price = 0.01
spread_source = "observed_rates_m5_recorded_spread_universe_scan"
swap_mode = 1
swap_long_points = -306.2
swap_short_points = 100.45

[risk]
max_entry_spread_price = 0.0125
implied_leverage = 20.000460530604176
margin_min_lot_eur = 44.13

[data_quality]
flags = ["shadow_only", "calendar_provisional", "spread_observed_m5", "commission_unverified", "no_fitted_thresholds", "quote_freshness_unverified_market_closed_at_scan"]

[provenance]
snapshot_date = "2026-09-30"
