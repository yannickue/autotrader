# BRENT (Phase 2, Lane M): MarketSpec for the ActivTrades DEMO "Brent" SPOT CFD (NOT the dated ICE futures CFDs BrentDec26/BrentNov26).
# Instrument facts OBSERVED via symbols_get, snapshot 2026-09-30 (research/reports/v2_markets/symbol_snapshot.json; docs/evidence/phase2_symbol_probe.json).
# Lane M2: the live probe (docs/evidence/phase2_symbol_probe.json, 2026-09-30 21:04 UTC) OBSERVED quote, margin, spreads and
# bar sessions; the former placeholders (spread cap, reference median spread) are replaced by those numbers below.
# Bar sessions are PROVISIONAL until broker-confirmed.
# Research/trading stays disabled here (trading_enabled must be false); the runner switch is configs/markets_phase2/enablement.toml.

[market]
canonical = "BRENT"
broker_symbol = "Brent"
broker_path = 'Spot Energy\Brent'
asset_class = "energy_cfd"
timezone = "Europe/London"
research_only = true
trading_enabled = false

[instrument]
point_size = 0.01
digits = 2
contract_size = 1000.0       # barrels per lot (observed)
tick_size = 0.01
volume_min = 0.01
volume_step = 0.01
volume_max = 10.0
currency_profit = "USD"
currency_margin = "USD"

[calendar]
# PROVISIONAL structural proposal (London reference day, like the existing non-GER40 markets). NOT broker-confirmed and
# NOT observed yet (symbol_info exposes no session times; the probe derives sessions from bar timestamps).
tz = "Europe/London"
cash_open = "08:00"
cash_close = "18:00"
entry_start = "08:00"
entry_end = "16:30"
forced_flat = "17:55"
status = "provisional"
weekend_policy = "No entries Sat/Sun (calendar is Mon-Fri). OBSERVED (M5 bars, server clock = UTC+2 at the probe): daily break 22:55 -> 02:00 server (= 20:55 -> 00:00 UTC), weekend break Fri 22:55 -> Mon 00:00 server (= Fri 20:55 -> Sun 22:00 UTC); no bars on Sat/Sun. PROVISIONAL until broker-confirmed."
holiday_policy = "UNVERIFIED: holiday/early-close behaviour of the Brent spot CFD not observed."
dst_notes = "ICE Brent and the US crude inventory release move with EU/US DST; the London reference session (08:00-18:00) lies fully inside the observed bars (server 02:00-22:55). Server clock = Europe/Berlin (observed +2 h offset at the probe; not broker-confirmed)."

[[calendar.buckets]]
name = "ASIA_PRE"
start = "00:00"
end = "08:00"

[[calendar.buckets]]
name = "LONDON_0800_1000"
start = "08:00"
end = "10:00"

[[calendar.buckets]]
name = "LONDON_MID_1000_1330"
start = "10:00"
end = "13:30"

[[calendar.buckets]]
name = "NY_OVERLAP_1330_1800"
start = "13:30"
end = "18:00"

[[calendar.buckets]]
name = "LATE_1800_2400"
start = "18:00"
end = "24:00"

[risk]
max_entry_spread_price = 0.08
spread_model_notes = "OBSERVED (probe 2026-09-30): recorded spread in points (1 pt = 0.01 USD): M1 n=5000 median 6, p95 6, p99 6, max 8; M5 n=12000 median 6, p99 6, max 8; H1 p99 7, max 10; live tick 7 pts. Cap 0.08 USD (= 8 pts = the M1/M5 observed max, one point above the p99 of any timeframe) replaces the former 0.10 placeholder (preflight: cap >= p95 and <= 10x median). Cost model uses the recorded median, not this cap."
max_leverage = 10.0  # OBSERVED broker margin: min-lot order_calc_margin 86.32 EUR at 97.78 => implied 9.99x (probe 2026-09-30). Hard ceiling 30x, never a target.
margin_notes = "OBSERVED: order_calc_margin(0.01 lot, 97.78) = 86.32 EUR buy / 86.26 sell (1 lot 8631.71 EUR); implied leverage 9.99x (trade_calc_mode=4 CFD leverage). Account leverage 1:30 is NOT the instrument leverage. Preflight requires spec max_leverage <= observed implied leverage."

[data_quality]
flags = ["quote_observed_2026-09-30", "margin_observed", "sessions_observed_from_bar_gaps", "calendar_provisional", "commission_unverified", "no_history_downloaded", "no_fitted_thresholds"]

[provenance]
snapshot_date = "2026-09-30"
server_tz_policy = "MT5 server clock = Europe/Berlin (UTC+2 CEST / UTC+1 CET); inferred from a live +7199s offset on the existing markets, cross-checked by DST-shifting cash-open volume peaks; not broker-confirmed. Observed on Brent itself: tick_time_minus_utc_s 6930 (2026-09-30, probe)."

[cost]
# Inputs wired into alpha.common.market_costs.cost_scenarios_for / sizing_for (median_spread_price override).
reference_median_spread_price = 0.06         # OBSERVED: M1 recorded-spread median 6 pts (probe 2026-09-30); replaced the 0.05 placeholder
spread_source = "observed_rates_m1_recorded_spread_probe_2026-09-30"
commission_eur_per_lot = 0.0
commission_source = "unverified_assumed_zero"   # same status as every non-GER40 market
swap_mode = 1                                   # observed enum value (MT5 docs: SYMBOL_SWAP_MODE_POINTS)
swap_long_points = 9.536                        # observed 2026-09-30
swap_short_points = -15.252                     # observed 2026-09-30
swap_modelled = false                           # positions are forced flat (no overnight); financing not modelled
min_movement_to_cost = 3.0                      # planned move (to target, else 1R) / round-trip cost, same semantics as TCA movement_to_cost

[preflight]
reference_structural_stop_price = 1.0           # USD/bbl; ONLY used to validate stops_level headroom, never a sizing rule
