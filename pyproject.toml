[project]
name = "autotrader-infrastructure"
version = "0.1.0"
description = "Deterministic, event-driven automated trading infrastructure."
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus-trader==1.231.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

