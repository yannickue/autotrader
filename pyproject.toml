[project]
name = "autotrader-infrastructure"
version = "0.1.0"
description = "Deterministic, event-driven automated trading infrastructure."
requires-python = ">=3.12,<3.13"
dependencies = [
    "metatrader5>=5.0.6231; sys_platform == 'win32'",
    "nautilus-trader==1.231.0",
    "pyarrow==25.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
]
learning = [
    "lightgbm==4.7.0",
    "mlflow==3.16.1",
    "river==0.26.1",
    "scikit-learn==1.9.1",
]
research = [
    "numba==0.67.0",
    "ta-lib==0.8.1",
    "optuna==5.0.0",
    "deap==1.4.4",
]

[tool.uv]
package = false
default-groups = ["dev", "research", "learning"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
# Markers are applied path-based by tests/conftest.py (see docs/TEST_TIMING.md / docs/TEST_GATES.md).
# Tier markers fast|integration|slow partition the suite; the rest are overlays.
markers = [
    "fast: pure/unit tier, target < 2 min (tier marker)",
    "integration: persistence/subprocess/runner/framework boundaries, target < 5 min (tier marker)",
    "slow: heavy research, real-data, replay, parity and chaos suites (tier marker)",
    "safety: risk/execution/reconciliation/persistence/reduce-only/idempotency/stale-signal/exposure/leverage invariants (overlay)",
    "chaos: failure-injection suites (overlay)",
    "replay: deterministic replay / parity suites (overlay)",
    "broker: MT5 / venue-adapter boundary tests, fake broker only (overlay)",
    "serial: shares on-disk/process-global resources; never run concurrently with other serial tests (overlay)",
    "xdist_group: pytest-xdist loadgroup grouping (inert without xdist)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]


[tool.ruff.lint.per-file-ignores]
# Parity scenarios carry prose rationale strings and Decimal constants as defaults.
"tests/parity/*" = ["E501", "B008"]
